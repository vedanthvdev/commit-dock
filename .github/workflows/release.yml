# Publishes to the Visual Studio Marketplace when a semver tag vX.Y.Z is pushed
# and matches package.json "version". Also uploads the VSIX to a GitHub Release.
#
# Required repository secret:
#   VSCE_PAT — PAT with "Marketplace (Manage)" scope
#   https://code.visualstudio.com/api/working-with-extensions/publishing-extension

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION (expected v$PKG_VERSION)"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Compile and lint
        run: npm run compile && npm run lint

      - name: Package VSIX
        run: npm run package

      - name: Check marketplace token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Configure the VSCE_PAT repository secret (Visual Studio Marketplace PAT with Marketplace Manage scope)."
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX="$(ls -1 ./*.vsix | head -n1)"
          npx --yes @vscode/vsce@3.3.0 publish --no-dependencies --packagePath "$VSIX"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="$(ls -1 ./*.vsix | head -n1)"
          gh release create "$GITHUB_REF_NAME" "$VSIX" --title "Commit Dock ${GITHUB_REF_NAME}" --generate-notes
