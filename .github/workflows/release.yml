# On tag push v*.*.* matching package.json "version":
# 1) Build and attach a VSIX to a GitHub Release (always, using GITHUB_TOKEN).
# 2) Publish to the Visual Studio Marketplace only when VSCE_PAT is configured.
#
# Previously the workflow failed before creating a GitHub Release when VSCE_PAT
# was missing, which left the Releases page empty for new tags.
#
# Optional repository secret (Marketplace only):
#   VSCE_PAT — PAT with "Marketplace (Manage)" scope
#   https://code.visualstudio.com/api/working-with-extensions/publishing-extension

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION (expected v$PKG_VERSION)"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Compile and lint
        run: npm run compile && npm run lint

      - name: Package VSIX
        run: npm run package

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VSIX="$(ls -1 ./*.vsix | head -n1)"
          if [ -z "${VSIX}" ] || [ ! -f "${VSIX}" ]; then
            echo "::error::No VSIX found after npm run package"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists; uploading VSIX (replace if present)"
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "Commit Dock ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::notice::VSCE_PAT is not set — skipping Marketplace publish. The GitHub Release with the VSIX is already available."
            exit 0
          fi
          VSIX="$(ls -1 ./*.vsix | head -n1)"
          npx --yes @vscode/vsce@3.3.0 publish --no-dependencies --packagePath "$VSIX"
