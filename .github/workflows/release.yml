# Triggered by:
# - Tag push `v*.*.*` (e.g. manual `git push origin v1.2.3`), or
# - `workflow_dispatch` (including dispatch from auto-tag-on-master.yml after it
#   pushes a new version tag).
#
# Builds the VSIX, creates/updates the GitHub Release, and publishes to the
# Marketplace when VSCE_PAT is set.
#
# Optional repository secret (Marketplace only):
#   VSCE_PAT — PAT with "Marketplace (Manage)" scope
#   https://code.visualstudio.com/api/working-with-extensions/publishing-extension

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag (e.g. v0.9.3). Must already exist on the remote.'
        required: true
        type: string

# Serialize with version bump + auto-tag so parallel automation cannot race on
# master, tags, or release assets (same idea as dayseam `release-master-push`).
concurrency:
  group: commit-dock-release-line
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag name
        id: rel_tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ steps.rel_tag.outputs.name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $PKG_VERSION (expected v$PKG_VERSION)"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Compile, typecheck, and lint
        run: npm run compile && npm run typecheck && npm run lint

      - name: Package VSIX
        run: npm run package

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.rel_tag.outputs.name }}
        run: |
          set -euo pipefail
          VSIX="$(ls -1 ./*.vsix | head -n1)"
          if [ -z "${VSIX}" ] || [ ! -f "${VSIX}" ]; then
            echo "::error::No VSIX found after npm run package"
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release exists; uploading VSIX (replace if present)"
            gh release upload "$TAG_NAME" "$VSIX" --clobber
          else
            gh release create "$TAG_NAME" "$VSIX" \
              --title "Commit Dock ${TAG_NAME}" \
              --generate-notes
          fi

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TAG_NAME: ${{ steps.rel_tag.outputs.name }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::notice::VSCE_PAT is not set — skipping Marketplace publish. Add the repository secret VSCE_PAT (Marketplace → Manage PAT), then re-run this workflow for the tag. See README → VS Code Marketplace."
            exit 0
          fi
          VSIX="$(ls -1 ./*.vsix | head -n1)"
          npx vsce publish --no-dependencies --packagePath "$VSIX"
