# When `package.json` "version" changes on a push to `master`, create and push
# tag `v{version}` on the new HEAD, then **dispatch** `release.yml` so a merge
# reliably produces a GitHub Release + VSIX (and Marketplace publish when
# VSCE_PAT is set).
#
# Even when the tag is pushed with a PAT (**TAG_PUSH_TOKEN**), GitHub often does
# **not** run other workflows from that tag `push` event. This workflow therefore
# calls `gh workflow run Release …` after a successful tag push.
#
# **TAG_PUSH_TOKEN** (recommended): classic PAT with **`repo`** scope, or a
# fine-grained PAT on this repo with **Contents: Read and write** and
# **Actions: Read and write** (needed for `workflow_dispatch` via the API).
# Used for `git push` of the tag and as `GH_TOKEN` for `gh workflow run`.
#
# If the secret is missing, the tag is pushed with `GITHUB_TOKEN` (other
# workflows still will not run from that push); this job still tries `gh workflow
# run` using `GITHUB_TOKEN`, which works when repo **Workflow permissions** allow
# **Read and write** for Actions. If dispatch fails, run **Release** manually.
#
# If the version is unchanged, this workflow does nothing (no duplicate releases).

name: Auto-tag version on master

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: write

concurrency:
  group: commit-dock-release-line
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create and push version tag when package.json bumps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          TAG_PUSH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid previous revision (new ref or unavailable); skipping auto-tag."
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            echo "package.json not found on previous revision; skipping."
            exit 0
          fi

          CUR="$(node -p "require('./package.json').version")"
          PREV="$(git show "${BEFORE_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"

          echo "package.json version: previous=${PREV} current=${CUR}"

          if [ "${PREV}" = "${CUR}" ]; then
            echo "Version unchanged; skipping tag."
            exit 0
          fi

          TAG="v${CUR}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            EXISTING="$(git rev-parse "${TAG}^{commit}")"
            if [ "${EXISTING}" = "${AFTER_SHA}" ]; then
              echo "Tag ${TAG} already points at this commit; nothing to do."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on commit ${EXISTING}. Refusing to move tags from CI."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${TAG}" "${AFTER_SHA}"

          if [ -n "${TAG_PUSH_TOKEN}" ]; then
            echo "Pushing tag using TAG_PUSH_TOKEN (contents write on the remote)."
            git push "https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
          else
            echo "::notice::TAG_PUSH_TOKEN is not set. Pushing the tag with GITHUB_TOKEN (tag push will not trigger other workflows). Ensure Actions → Workflow permissions allow read/write, or add TAG_PUSH_TOKEN so dispatch below can authenticate."
            git push origin "refs/tags/${TAG}"
          fi

          echo "Dispatching Release workflow for ${TAG} (workflow_dispatch)…"
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) not found on runner; run Actions → Release manually for ${TAG}."
            exit 0
          fi

          if [ -n "${TAG_PUSH_TOKEN}" ]; then
            export GH_TOKEN="${TAG_PUSH_TOKEN}"
          else
            export GH_TOKEN="${GITHUB_TOKEN}"
          fi

          set +e
          gh workflow run "Release" --repo "${GITHUB_REPOSITORY}" -f "tag=${TAG}"
          gh_rc=$?
          set -e
          if [ "${gh_rc}" -ne 0 ]; then
            echo "::warning::Could not dispatch Release for ${TAG} (exit ${gh_rc}). Run Actions → Release → workflow_dispatch with that tag. For PATs: fine-grained needs **Actions: Read and write**; classic needs **repo** (or workflow) scope."
          fi
